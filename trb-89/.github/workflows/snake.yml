name: Generate Snake Contribution Animation

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Monochrome Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: trb-89
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C0C0C0&color_dots=#121212,#222222,#444444,#888888,#E5E5E5
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#C0C0C0&color_dots=#121212,#222222,#444444,#888888,#E5E5E5

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
